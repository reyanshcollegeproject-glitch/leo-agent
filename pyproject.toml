[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-muse-agent"
version = "1.0.0"
description = "Production-ready autonomous OS & laptop control agent powered by Meta AI Muse frontier models."
readme = "README.md"
authors = [{ name = "Meta Muse Agent Systems Team" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "mss>=9.0.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "websockets>=12.0",
    "pyautogui>=0.9.54",
    "python-dotenv>=1.0.0"
]

[project.scripts]
muse-agent = "muse_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["muse_agent*"]
